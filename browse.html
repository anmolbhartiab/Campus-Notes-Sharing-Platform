{% extends 'base.html' %}{% from '_macros.html' import card, subjects with context %}{% block body %}
<section><div class="wrap"><h2>Browse resources</h2>
<form class="filters" method="get"><input name="q" value="{{ f.q or '' }}" placeholder="Search title…">
<select name="subject"><option value="">All subjects</option>{{ subjects(f.subject) }}</select>
<select name="semester"><option value="">All semesters</option>{% for i in range(1,9) %}<option value="{{ i }}" {{ 'selected' if f.semester==i|string }}>Sem {{ i }}</option>{% endfor %}</select>
<select name="kind"><option value="">Notes & papers</option><option value="note" {{ 'selected' if f.kind=='note' }}>Notes</option><option value="paper" {{ 'selected' if f.kind=='paper' }}>Question papers</option></select>
<select name="sort"><option value="">Newest</option><option value="popular" {{ 'selected' if f.sort=='popular' }}>Most downloaded</option><option value="rating" {{ 'selected' if f.sort=='rating' }}>Top rated</option></select>
<button class="btn">Filter</button></form>
{% if notes %}<div class="grid">{% for n in notes %}{{ card(n, admin=me and me.is_admin, owner=me and me.id==n.user_id) }}{% endfor %}</div>
{% else %}<div class="empty">No results found.</div>{% endif %}</div></section>{% endblock %}
